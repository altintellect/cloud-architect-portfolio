# ============================================
# GITHUB ACTIONS WORKFLOW
# Deploys azdemo infrastructure to Azure
# including a Virtual Machine
# ============================================

name: AzDemo Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'iac/azdemo/**'
  workflow_dispatch:

jobs:
  terraform-deploy:
    name: Terraform Deploy AzDemo
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: iac/azdemo
        run: terraform init

      - name: Terraform Format Check
        working-directory: iac/azdemo
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: iac/azdemo
        run: terraform validate

      - name: Terraform Plan
        working-directory: iac/azdemo
        run: |
          terraform plan \
            -var="resource_group_name=rg-azdemo-test" \
            -var="location=canadacentral" \
            -var="environment=test" \
            -var="storage_account_name=stazdemo001ca" \
            -var="vm_admin_username=${{ secrets.VM_ADMIN_USERNAME }}" \
            -var="vm_admin_password=${{ secrets.VM_ADMIN_PASSWORD }}"

      - name: Terraform Apply
        working-directory: iac/azdemo
        run: |
          terraform apply -auto-approve \
            -var="resource_group_name=rg-azdemo-test" \
            -var="location=canadacentral" \
            -var="environment=test" \
            -var="storage_account_name=stazdemo001ca" \
            -var="vm_admin_username=${{ secrets.VM_ADMIN_USERNAME }}" \
            -var="vm_admin_password=${{ secrets.VM_ADMIN_PASSWORD }}"