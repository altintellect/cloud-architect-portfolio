# ============================================
# GITHUB ACTIONS WORKFLOW
# Deploys altintellect foundation infrastructure
# ============================================

name: Foundation Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'iac/foundation/**'
  workflow_dispatch:

jobs:
  terraform-deploy:
    name: Terraform Deploy Foundation
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: iac/foundation
        run: terraform init

      - name: Terraform Format Check
        working-directory: iac/foundation
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: iac/foundation
        run: terraform validate

      - name: Terraform Plan
        working-directory: iac/foundation
        run: |
          terraform plan \
            -var="resource_group_name=rg-altint-foundation" \
            -var="location=canadacentral" \
            -var="environment=production" \
            -var="storage_account_name=staltintfnd001ca"

      - name: Terraform Apply
        working-directory: iac/foundation
        run: |
          terraform apply -auto-approve \
            -var="resource_group_name=rg-altint-foundation" \
            -var="location=canadacentral" \
            -var="environment=production" \
            -var="storage_account_name=staltintfnd001ca"