# Prometheus Alert Rules — Cloud Infrastructure
# Covers: Kubernetes, Azure, and Application layers

groups:
  # ── Kubernetes Alerts ────────────────────────────────────────────────────────
  - name: kubernetes.rules
    interval: 30s
    rules:
      - alert: KubernetesPodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Pod has restarted {{ $value }} times in the last 15 minutes."
          runbook: "https://github.com/altintellect/cloud-architect-portfolio/blob/main/runbooks/incident-response.md"

      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Kubernetes node {{ $labels.node }} is not ready"
          description: "Node {{ $labels.node }} has been not ready for more than 5 minutes."
          runbook: "https://github.com/altintellect/cloud-architect-portfolio/blob/main/runbooks/incident-response.md"

      - alert: KubernetesDeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas != kube_deployment_status_available_replicas
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica mismatch"
          description: "Expected {{ $labels.spec_replicas }} replicas but only {{ $value }} available."

      - alert: KubernetesPVCPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} stuck in Pending"
          description: "PersistentVolumeClaim has been in Pending state for more than 10 minutes."

      - alert: KubernetesHighMemoryUsage
        expr: |
          sum(container_memory_working_set_bytes{container!=""}) by (pod, namespace)
          /
          sum(kube_pod_container_resource_limits{resource="memory"}) by (pod, namespace)
          > 0.90
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} memory usage above 90%"
          description: "Pod is using {{ $value | humanizePercentage }} of its memory limit."

      - alert: KubernetesHighCPUUsage
        expr: |
          sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod, namespace)
          /
          sum(kube_pod_container_resource_limits{resource="cpu"}) by (pod, namespace)
          > 0.90
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CPU usage above 90%"
          description: "Pod is using {{ $value | humanizePercentage }} of its CPU limit."

  # ── Application Alerts ───────────────────────────────────────────────────────
  - name: application.rules
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
          /
          sum(rate(http_requests_total[5m])) by (service)
          > 0.05
        for: 2m
        labels:
          severity: critical
          team: application
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} over last 5 minutes."
          runbook: "https://github.com/altintellect/cloud-architect-portfolio/blob/main/runbooks/incident-response.md"

      - alert: P99LatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: application
        annotations:
          summary: "P99 latency above 2s for {{ $labels.service }}"
          description: "99th percentile latency is {{ $value }}s for {{ $labels.service }}."

      - alert: ServiceDown
        expr: up{job=~".*service.*"} == 0
        for: 1m
        labels:
          severity: critical
          team: application
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for 1 minute."

      - alert: HighRequestRate
        expr: |
          sum(rate(http_requests_total[5m])) by (service) > 10000
        for: 5m
        labels:
          severity: warning
          team: application
        annotations:
          summary: "Unusually high request rate on {{ $labels.service }}"
          description: "Request rate is {{ $value }} req/s — possible traffic spike or DDoS."

  # ── Infrastructure Alerts ────────────────────────────────────────────────────
  - name: infrastructure.rules
    interval: 60s
    rules:
      - alert: NodeDiskPressure
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Node {{ $labels.instance }} disk usage above 85%"
          description: "Available disk space is {{ $value | humanizePercentage }} on {{ $labels.instance }}."

      - alert: NodeHighLoad
        expr: node_load15 / count(node_cpu_seconds_total{mode="idle"}) by (instance) > 0.85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High load average on {{ $labels.instance }}"
          description: "15-minute load average is {{ $value }} on {{ $labels.instance }}."

      - alert: CertificateExpiringSoon
        expr: |
          (x509_cert_expiry - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          team: security
        annotations:
          summary: "TLS certificate expiring in less than 30 days"
          description: "Certificate {{ $labels.subject }} expires in {{ $value }} days."

      - alert: CertificateExpiredCritical
        expr: |
          (x509_cert_expiry - time()) / 86400 < 7
        for: 1h
        labels:
          severity: critical
          team: security
        annotations:
          summary: "TLS certificate expiring in less than 7 days"
          description: "Certificate {{ $labels.subject }} expires in {{ $value }} days. Immediate action required."
